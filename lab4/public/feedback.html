<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f4f7fb;color:#222}
nav{background:#173b73;color:#fff;padding:16px 6%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}.logo{font-size:23px;font-weight:700}.nav-links{display:flex;gap:18px;list-style:none}.nav-links a{color:#fff;text-decoration:none;font-weight:600}.nav-links a:hover{color:#ffd43b}
.container{max-width:650px;margin:45px auto;padding:32px;background:#fff;border-radius:14px;box-shadow:0 8px 25px #0001}.container h1{text-align:center;color:#173b73}.subtitle{text-align:center;color:#666;margin:8px 0 25px}form{display:grid;gap:12px}label{font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd3dd;border-radius:7px;font-size:15px}textarea{resize:vertical}button{padding:13px;background:#173b73;color:#fff;border:0;border-radius:7px;font-size:16px;font-weight:bold;cursor:pointer}button:hover{background:#0e2b56}
footer{background:#122d59;color:#fff;text-align:center;padding:25px;margin-top:50px}.social{margin:12px 0}.social a{color:#fff;font-size:22px;margin:0 9px}.social a:hover{color:#ffd43b}
@media(max-width:700px){nav{justify-content:center;gap:15px}.nav-links{flex-wrap:wrap;justify-content:center;gap:10px}.container{width:92%;padding:24px}}
</style>
</head>
<body>
<nav><div class="logo">Bright Future Tuition</div><ul class="nav-links"><li><a href="registration.html">Registration</a></li><li><a href="login.html">Login</a></li><li><a href="courses.html">Courses</a></li><li><a href="feedback.html">Feedback</a></li><li><a href="pricing.html">Price Details</a></li></ul></nav>
<main class="container"><h1>Student Feedback</h1><p class="subtitle">Your feedback helps us improve our classes.</p>
<form><label>Student Name</label><input type="text" placeholder="Enter your name" required><label>Email Address</label><input type="email" placeholder="Enter your email" required><label>Course</label><select required><option value="">Select Course</option><option>Mathematics</option><option>Science</option><option>English</option><option>All Subjects</option></select><label>Rating</label><select required><option value="">Select Rating</option><option>5 - Excellent</option><option>4 - Very Good</option><option>3 - Good</option><option>2 - Average</option><option>1 - Needs Improvement</option></select><label>Your Feedback</label><textarea rows="6" placeholder="Write your feedback here..." required></textarea><button type="submit">Submit Feedback</button></form></main>
