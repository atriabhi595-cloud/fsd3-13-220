<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration | Bright Future Tuition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f4f7fb;color:#222;line-height:1.6}
nav{background:#173b73;color:#fff;padding:16px 6%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font-size:23px;font-weight:700}.nav-links{display:flex;gap:18px;list-style:none}.nav-links a{color:#fff;text-decoration:none;font-weight:600}.nav-links a:hover{color:#ffd43b}
.container{max-width:650px;margin:45px auto;padding:32px;background:#fff;border-radius:14px;box-shadow:0 8px 25px #0001}.container h1{text-align:center;color:#173b73}.subtitle{text-align:center;color:#666;margin:8px 0 25px}
form{display:grid;gap:12px}label{font-weight:600}input,select{width:100%;padding:12px;border:1px solid #ccd3dd;border-radius:7px;font-size:15px}button{padding:13px;background:#173b73;color:#fff;border:0;border-radius:7px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}button:hover{background:#0e2b56}
footer{background:#122d59;color:#fff;text-align:center;padding:25px;margin-top:50px}.social{margin:12px 0}.social a{color:#fff;font-size:22px;margin:0 9px}.social a:hover{color:#ffd43b}
@media(max-width:700px){nav{justify-content:center;gap:15px}.nav-links{flex-wrap:wrap;justify-content:center;gap:10px}.container{width:92%;padding:24px}}
</style>
</head>
<body>
<nav><div class="logo">Bright Future Tuition</div><ul class="nav-links">
<li><a href="registration.html">Registration</a></li><li><a href="login.html">Login</a></li><li><a href="courses.html">Courses</a></li><li><a href="feedback.html">Feedback</a></li><li><a href="pricing.html">Price Details</a></li>
</ul></nav>
<main class="container">
<h1>Student Registration</h1><p class="subtitle">Join Bright Future Tuition Classes today.</p>
<form>
<label>Full Name</label><input type="text" placeholder="Enter your full name" required>
<label>Email Address</label><input type="email" placeholder="Enter your email" required>
<label>Mobile Number</label><input type="tel" placeholder="Enter your mobile number" required>
<label>Create Password</label><input type="password" placeholder="Create a password" required>
<label>Class</label><select required><option value="">Select Class</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select>
<label>Course</label><select required><option value="">Select Course</option><option>Mathematics</option><option>Science</option><option>English</option><option>All Subjects</option></select>
<button type="submit">Register Now</button>
</form></main>
<footer><p>Follow us on social media</p><div class="social"><a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a><a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a><a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a><a href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a></div><p>&copy; 2026 Bright Future Tuition Classes. All Rights Reserved.</p></footer>
</body></html>
